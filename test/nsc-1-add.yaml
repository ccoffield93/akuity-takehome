# Same as nsc-1.yaml, but add a new item, to test that it gets added to linked namespaces
apiVersion: akuity.io/v1
kind: NamespaceClass
metadata:
  name: demo-namespaceclass
spec:
  resources:
    - type: "NetworkPolicy"
      name: "demo-networkpolicy"
    - type: "ServiceAccount"
      name: "demo-serviceaccount"
    - type: "ConfigMap"
      name: "demo-configmap"